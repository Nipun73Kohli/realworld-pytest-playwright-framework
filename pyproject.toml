[project]
name = "realworld-pytest-playwright-framework"
version = "0.1.0"
description = "Pytest Playwright automation framework for the RealWorld application"
requires-python = ">=3.11,<3.15"

dependencies = [
    "pytest>=8.3,<10.0",
    "playwright>=1.50,<2.0",
    "pytest-playwright>=0.7,<1.0",
    "python-dotenv>=1.0,<2.0",
]